name: Update Macro & Market Data
on:
  schedule:
    - cron: '17 */2 * * *' # 每 2 小時的第 17 分鐘執行一次 (台灣時間 00:17, 02:17, 04:17...)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests pandas
      - name: Run data updater
        run: |
          python update_macro_data.py
          python update_tw_bottom_data.py
          python update_tech_earnings.py
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_live_data.json tw_bottom_data.json tw_bottom_prev.json tech_earnings_data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update macro, taiwan bottom and tech earnings data"
            git pull --rebase origin main
            git push
          fi
