name: Update Macro & Market Data
on:
  schedule:
    - cron: '37 6 * * *'   # 每天 UTC 06:37 (台灣 14:37 台股收盤後)
    - cron: '37 22 * * *'  # 每天 UTC 22:37 (台灣隔日 06:37，預留美股收盤資料結算時間)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests pandas
      - name: Run data updater
        run: |
          python update_macro_data.py
          python update_tw_bottom_data.py
          python update_tech_earnings.py
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_live_data.json tw_bottom_data.json tw_bottom_prev.json tech_earnings_data.json
          git diff --staged --quiet || git commit -m "chore: auto-update macro, taiwan bottom and tech earnings data"
          git push
