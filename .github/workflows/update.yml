name: Update Macro & Market Data
on:
  schedule:
    - cron: '30 22 * * *'          # 台灣時間 06:30 (美股收盤結算必跑一次)
    - cron: '17 1,4,7,10,13 * * *' # 台灣時間 09:17, 12:17, 15:17, 18:17, 21:17 (白天每 3 小時一次)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Update macro and market data
        id: macro
        continue-on-error: true
        timeout-minutes: 25
        run: python update_macro_data.py
      - name: Update Taiwan market data
        id: taiwan
        continue-on-error: true
        timeout-minutes: 12
        run: python update_tw_bottom_data.py
      - name: Update technology earnings data
        id: earnings
        continue-on-error: true
        timeout-minutes: 8
        run: python update_tech_earnings.py
      - name: Audit production data integrity
        id: audit
        run: python audit_data_integrity.py
      - name: Commit updated JSON
        if: always() && steps.audit.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_live_data.json tw_bottom_data.json tw_bottom_prev.json tech_earnings_data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update macro, taiwan bottom and tech earnings data"
            git pull --rebase origin main
            git push
          fi
      - name: Verify all data pipelines
        if: always()
        env:
          MACRO_RESULT: ${{ steps.macro.outcome }}
          TAIWAN_RESULT: ${{ steps.taiwan.outcome }}
          EARNINGS_RESULT: ${{ steps.earnings.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
        run: |
          echo "macro=$MACRO_RESULT taiwan=$TAIWAN_RESULT earnings=$EARNINGS_RESULT audit=$AUDIT_RESULT"
          test "$MACRO_RESULT" = success
          test "$TAIWAN_RESULT" = success
          test "$EARNINGS_RESULT" = success
          test "$AUDIT_RESULT" = success
