name: Update Macro & Market Data
on:
  schedule:
    - cron: '30 6 * * 1-5'   # 週一至週五 UTC 06:30 (台灣 14:30 台股收盤後)
    - cron: '0 22 * * 1-5'   # 週一至週五 UTC 22:00 (台灣隔日 06:00 美股收盤後)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run data updater
        run: python update_macro_data.py
      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_live_data.json
          git diff --staged --quiet || git commit -m "chore: update live macro data"
          git push
